# Render blueprint: one free web service. The database is external (Neon), because
# Render's free Postgres is deleted after 30 days.
services:
  - type: web
    name: launchtec-bdr
    runtime: node
    plan: free
    # Same region as the Neon database (AWS US East 2, Ohio).
    region: ohio
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: APP_USERNAME
        value: jacob
      # Set in the Render dashboard, never in this file.
      - key: APP_PASSWORD
        generateValue: true
      - key: INGEST_TOKEN
        generateValue: true
